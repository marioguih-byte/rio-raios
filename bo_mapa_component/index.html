<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0f16; }
  #map { position: relative; width: 100%; height: 650px; background: #0b0f16; }
  .leaflet-container { background: #cfd6dc !important; }
  .raio-celula-icon { background: transparent !important; border: none !important; }

  #raios-status-bar { position: absolute; z-index: 1000; top: 8px; left: 50px; background: rgba(15,15,20,0.75);
    color: #e5e7eb; padding: 4px 10px; border-radius: 6px; font: 12px sans-serif; transition: opacity 0.4s ease; }

  #busca-unidade-bar { position: absolute; z-index: 1000; top: 50px; right: 8px; background: rgba(15,15,20,0.75);
    padding: 4px 8px; border-radius: 6px; }
  #busca-unidade-input { width: 180px; font: 12px sans-serif; padding: 3px 6px; border-radius: 4px;
    border: 1px solid #374151; background: #111827; color: #e5e7eb; }

  /* ---------- painel da unidade (abre ao clicar no marcador) ---------- */
  #painel_estacao { display: none; position: absolute; inset: 10px; z-index: 1200; overflow-y: auto;
    background: #1a1d24; color: #e8eaed; border: 1px solid #2a303b; border-radius: 12px; padding: 22px 28px 26px;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif; box-shadow: 0 12px 44px rgba(0,0,0,0.65); }
  .pe-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  #pe_titulo { font-size: 22px; font-weight: 700; color: #fff; }
  #pe_sub { font-size: 12.5px; color: #8b93a3; margin-top: 8px; }
  #painel_estacao_fechar { cursor: pointer; color: #9aa3b2; font-size: 18px; line-height: 1; padding: 4px 8px; border-radius: 6px; }
  #painel_estacao_fechar:hover { background: #2a303b; color: #fff; }
  .pe-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 18px 0 6px; }
  .pe-card { background: #20242d; border: 1px solid #2d3340; border-top: 3px solid #2d3340; border-radius: 8px; padding: 11px 14px 12px; }
  .pe-card .lab { font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: #8b93a3; }
  .pe-card .val { font-size: 22px; font-weight: 700; color: #fff; margin: 3px 0 2px; }
  .pe-card .sub { font-size: 11px; color: #8b93a3; line-height: 1.35; }
  .pe-sec { font-size: 14.5px; font-weight: 700; color: #fff; margin: 24px 0 4px; }
  .pe-nota { font-size: 12px; color: #8b93a3; margin: 0 0 10px; }
  .pe-tab { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
  .pe-tab td, .pe-tab th { border: 1px solid #2d3340; padding: 7px 11px; text-align: right; }
  .pe-tab th { color: #8b93a3; font-weight: 600; background: #1e222a; }
  .pe-tab td:first-child, .pe-tab th:first-child { text-align: left; }
  .pe-chart { position: relative; height: 250px; }
  .pe-contatos { margin-top: 22px; font-size: 12.5px; color: #c4cbd6; line-height: 1.65; }
  .pe-carregando { color: #9aa3b2; font-size: 12.5px; margin-top: 20px; }

  /* ---------- legenda retrátil (começa recolhida) ---------- */
  #legenda-mapa { position: absolute; z-index: 1000; bottom: 22px; left: 8px; background: rgba(15,15,20,0.88);
    color: #e5e7eb; padding: 7px 11px; border-radius: 8px; font: 11px 'Segoe UI', sans-serif; line-height: 1.5; max-width: 230px; }
  #legenda-toggle { cursor: pointer; font-weight: 700; color: #3fc2c2; user-select: none; }
  #legenda-corpo { display: none; margin-top: 6px; }
  #legenda-mapa.aberta #legenda-corpo { display: block; }

  /* ---------- deslocamento das células ---------- */
  .cel-pulse-icon { background: transparent !important; border: none !important; }
  .cel-pulse { position: relative; width: 30px; height: 30px; }
  .cel-pulse::before { content: ""; position: absolute; inset: 0; border: 2.5px solid #7c3aed; border-radius: 50%;
    animation: celping 1.8s ease-out infinite; }
  .cel-pulse span { position: absolute; inset: 9px; background: #7c3aed; border: 2.5px solid #fff; border-radius: 50%;
    box-shadow: 0 0 6px rgba(0,0,0,0.55); }
  @keyframes celping { 0% { transform: scale(0.5); opacity: 0.95; } 100% { transform: scale(1.5); opacity: 0; } }
  .cel-seta-icon { background: transparent !important; border: none !important; }
  .cel-seta { font-size: 20px; line-height: 20px; text-align: center; color: #7c3aed; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff; }
  .leaflet-tooltip.cel-tip { background: rgba(17,24,39,0.93); color: #fff; border: 1px solid #7c3aed; border-radius: 10px;
    padding: 2px 8px; font: 600 11px 'Segoe UI', sans-serif; box-shadow: 0 1px 5px rgba(0,0,0,0.4); }
  .leaflet-tooltip.cel-tip::before { display: none; }

  .leaflet-control-layers { background: rgba(15,15,20,0.9) !important; color: #e5e7eb; border: 1px solid #374151 !important;
    font: 12px 'Segoe UI', sans-serif; }
  .leaflet-control-layers-toggle { filter: invert(0.9); }
  .leaflet-control-layers-separator { border-color: #374151 !important; }
</style>
</head>
<body>
<div id="map">
  <div id="raios-status-bar"></div>
  <div id="busca-unidade-bar">
    <input id="busca-unidade-input" list="busca-unidade-lista" placeholder="🔎 Buscar unidade…" autocomplete="off" />
    <datalist id="busca-unidade-lista"></datalist>
  </div>
  <div id="painel_estacao">
    <div class="pe-head">
      <div>
        <div id="pe_titulo">—</div>
        <div id="pe_sub"></div>
      </div>
      <span id="painel_estacao_fechar" title="Fechar (Esc)">✕</span>
    </div>
    <div id="pe_cards"></div>
    <div id="pe_prev"></div>
    <div id="pe_contatos" class="pe-contatos"></div>
  </div>
  <div id="legenda-mapa">
    <div id="legenda-toggle"><span id="legenda-seta">▸</span> Legenda</div>
    <div id="legenda-corpo"></div>
  </div>
</div>

  }

  function abrirPainel(chave) {
    var d = dadosPorChave[chave];
    if (!d) return;
    var painel = document.getElementById("painel_estacao");
    painel.style.display = "block";
    painel.scrollTop = 0;
    document.getElementById("pe_titulo").textContent = (d.risco_emoji || "") + " " + d.nome;
    document.getElementById("pe_sub").textContent =
      "Modelos: ECMWF · ICON · GFS (Open-Meteo) · Raios: GLM/GOES-19 · Horário de Brasília";
    document.getElementById("pe_cards").innerHTML = cardsStatus(d);

    var corpo = document.getElementById("pe_contatos");
    var contatos = d.contatos;
    if (!contatos || !contatos.numeros || !contatos.numeros.length) {
      corpo.innerHTML = "<span style='color:#9ca3af;'>Nenhum contato cadastrado para esta unidade.</span>";
    } else {
      var html = "<b style='color:#3fc2c2;'>📞 Contatos — " + esc(contatos.nome) + "</b><br/>";
      contatos.numeros.slice(0, 3).forEach(function (item) {
        html += esc(item.numero);
        if (item.descricao) html += " <i style='color:#8b93a3;'>(" + esc(item.descricao) + ")</i>";
        html += "<br/>";
      });
      corpo.innerHTML = html;
    }
    carregarPrevisao(chave);
  }

  function iniciarMapa() {
    map = L.map("map", { zoomControl: true, minZoom: 4, maxZoom: 17, preferCanvas: true });

    // Fundos: OpenStreetMap (padrão) e Satélite (Esri World Imagery) — ambos
    // públicos, sem chave de API. GOES-East (NASA GIBS, infravermelho limpo,
    // banda 13) entra como camada sobreposta, ligada por padrão.
    var fundoOSM = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors", maxZoom: 19, subdomains: "abc"
    });
    var fundoSatelite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      attribution: "Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community", maxZoom: 19
    });
    goesLayer = L.tileLayer.wms("https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi", {
      layers: "GOES-East_ABI_Band13_Clean_Infrared", format: "image/png", transparent: true, version: "1.1.1",
      opacity: 0.6, zIndex: 10, attribution: "GOES-East ABI &copy; NOAA/NASA GIBS"
    });

    fundoOSM.addTo(map);
    goesLayer.addTo(map);
    layersControl = L.control.layers(
      { "🗺️ OpenStreetMap": fundoOSM, "🛰️ Satélite (Esri)": fundoSatelite },
      { "🛰️ GOES-East (IR banda 13)": goesLayer },
      { position: "topright", collapsed: true }
    ).addTo(map);
    // GOES-East atualiza a cada 10 min: força o Leaflet a rebuscar os tiles.
    setInterval(function () { try { goesLayer.setParams({ _t: Date.now() }, false); } catch (e) {} }, 600000);

    var bb = { lat_min: -34.0, lat_max: 5.5, lon_min: -74.5, lon_max: -32.0 };
    map.fitBounds([[bb.lat_min, bb.lon_min], [bb.lat_max, bb.lon_max]]);
    map.setMaxBounds([[bb.lat_min - 6, bb.lon_min - 6], [bb.lat_max + 6, bb.lon_max + 6]]);

    if (!map.getPane("markerPane")) { map.createPane("markerPane"); }
    map.getPane("markerPane").style.zIndex = 650;

    // Divisão de UFs: linha escura com contorno claro, legível no OSM e no satélite.
    // Entra antes das demais camadas pra ficar por baixo dos anéis e dos raios.
    var uf_ll = UF_LINHAS.map(function (ln) { return ln.map(function (p) { return [p[1], p[0]]; }); });
    ufLayer = L.layerGroup([
      L.polyline(uf_ll, { color: "#ffffff", weight: 4, opacity: 0.55, interactive: false, renderer: canvasRenderer }),
      L.polyline(uf_ll, { color: "#1e293b", weight: 1.6, opacity: 0.95, interactive: false, renderer: canvasRenderer }),
    ]).addTo(map);
    layersControl.addOverlay(ufLayer, "🗺️ Divisão de UFs");

    stationsLayer = L.layerGroup().addTo(map);
    aneisLayer = L.layerGroup().addTo(map);
    raiosLayer = L.layerGroup().addTo(map);
    celulasLayer = L.layerGroup().addTo(map);

    // Restaura o zoom/posição salvos — como esse mapa é montado só uma
    // vez (o componente não recria o iframe entre atualizações), isso na
    // prática só importa na primeira carga da página.
    try {
      var salvo = JSON.parse(localStorage.getItem("blueocean_raios_view_v1") || "null");
      if (salvo && typeof salvo.lat === "number") map.setView([salvo.lat, salvo.lng], salvo.zoom);
    } catch (e) {}
    map.on("moveend zoomend", function () {
      try {
        var c = map.getCenter();
        localStorage.setItem("blueocean_raios_view_v1", JSON.stringify({ lat: c.lat, lng: c.lng, zoom: map.getZoom() }));
      } catch (e) {}
    });

    document.addEventListener("click", destravarSom, true);
    document.addEventListener("keydown", destravarSom, true);

    document.getElementById("painel_estacao_fechar").addEventListener("click", fecharPainel);
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") fecharPainel(); });
    // O painel e a legenda ficam por cima do mapa: cliques/rolagem neles não devem mexer no mapa.
    ["painel_estacao", "legenda-mapa"].forEach(function (id) {
      var el = document.getElementById(id);
      L.DomEvent.disableClickPropagation(el);
      L.DomEvent.disableScrollPropagation(el);
    });
    document.getElementById("legenda-toggle").addEventListener("click", function () {
      var aberta = document.getElementById("legenda-mapa").classList.toggle("aberta");
      document.getElementById("legenda-seta").textContent = aberta ? "▾" : "▸";
    });

    var inputBusca = document.getElementById("busca-unidade-input");
    inputBusca.addEventListener("change", function () { irParaUnidade(inputBusca.value); });
    inputBusca.addEventListener("keydown", function (ev) { if (ev.key === "Enter") irParaUnidade(inputBusca.value); });
  }

  function redesenharEstacoes(estacoes, aneis) {
    stationsLayer.clearLayers();
    aneisLayer.clearLayers();
    marcadoresPorNome = {};
    coordsPorNome = {};
    dadosPorChave = {};
    chavePorNome = {};
    var opcoes = "";
    (estacoes || []).forEach(function (e) {
      var texto = (e.dist_min_km === null || e.dist_min_km === undefined)
        ? "sem raios na janela atual" : e.dist_min_km.toFixed(0) + " km do raio mais próximo";
      var marcador = L.circleMarker([e.lat, e.lon], {
        radius: 7, pane: "markerPane", color: e.risco_color, weight: 2, fill: true, fillColor: e.risco_color, fillOpacity: 0.9, renderer: canvasRenderer,
      });
      // Tooltip somente durante o hover; nunca fica preso após sair do marcador.
      marcador.bindTooltip(e.risco_emoji + " " + e.nome + " — " + texto, {
        sticky: false,
        permanent: false,
        interactive: false,
        autoClose: true,
        closeOnClick: true
      });
      marcador.on("mouseover", function () { this.openTooltip(); });
      marcador.on("mouseout", function () { this.closeTooltip(); });
      marcador.on("remove", function () { this.closeTooltip(); });
      marcador.on("click", function (ev) {
        if (ev && ev.originalEvent) {
          L.DomEvent.stopPropagation(ev.originalEvent);
          L.DomEvent.preventDefault(ev.originalEvent);
        }
        this.closeTooltip();
        abrirPainel(e.estacao);
      });
      marcador.addTo(stationsLayer);

      marcadoresPorNome[e.nome] = marcador;
      coordsPorNome[e.nome] = { lat: e.lat, lon: e.lon };
      dadosPorChave[e.estacao] = e;
      chavePorNome[e.nome] = e.estacao;
      opcoes += '<option value="' + String(e.nome).replace(/"/g, "&quot;") + '">';

      (aneis || []).forEach(function (a) {
        L.circle([e.lat, e.lon], { radius: a.km * 1000, color: a.cor, weight: 4.5, fill: false, dashArray: "12, 9", opacity: 0.95, interactive: false, renderer: canvasRenderer })
          .addTo(aneisLayer);
      });
    });
    document.getElementById("busca-unidade-lista").innerHTML = opcoes;
  }

  function redesenharRaios(raios, celulas, janelaMin, mostrarDeslocamento) {
    raiosLayer.clearLayers();
    (raios || []).forEach(function (r) {
      var cor = corPorIdade(r.idade_min);
      L.circleMarker([r.lat, r.lon], { radius: 6.5, color: "#111827", weight: 1.2, fill: true, fillColor: cor, fillOpacity: 0.95, renderer: canvasRenderer })
        .addTo(raiosLayer);
    });

    celulasLayer.clearLayers();
    if (mostrarDeslocamento) {
      (celulas || []).forEach(function (cel) { desenharCelula(cel); });
    }
  }

  // ---------------- deslocamento das células de tempestade ----------------
  // Trilha percorrida (mais opaca = mais recente) + cone de incerteza e
  // trajetória prevista com marcas de +30/+60/+90 min, seta de direção e
  // um marcador pulsante na posição atual com a velocidade da célula.
  var COR_CEL = "#7c3aed";
  var SETAS_RUMO = { N: "↑", NE: "↗", E: "→", SE: "↘", S: "↓", SW: "↙", W: "←", NW: "↖" };

  function distKm(a, b) {
    var dlat = (a.lat - b.lat) * 111, dlon = (a.lon - b.lon) * 111 * Math.cos((a.lat + b.lat) / 2 * Math.PI / 180);
    return Math.sqrt(dlat * dlat + dlon * dlon);
  }
  function rumoGraus(a, b) {
    var r = Math.PI / 180, dl = (b.lon - a.lon) * r, la1 = a.lat * r, la2 = b.lat * r;
    var y = Math.sin(dl) * Math.cos(la2), x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dl);
    return (Math.atan2(y, x) / r + 360) % 360;
  }
  function destinoPonto(lat, lon, brng, km) {
    var r = Math.PI / 180, R = 6371, la1 = lat * r, lo1 = lon * r, br = brng * r, dd = km / R;
    var la2 = Math.asin(Math.sin(la1) * Math.cos(dd) + Math.cos(la1) * Math.sin(dd) * Math.cos(br));
    var lo2 = lo1 + Math.atan2(Math.sin(br) * Math.sin(dd) * Math.cos(la1), Math.cos(dd) - Math.sin(la1) * Math.sin(la2));
    return [la2 / r, lo2 / r];
  }

  function desenharCelula(cel) {
    var hist = cel.historico || [];
    if (hist.length < 2) return;
    var atual = hist[hist.length - 1];
    var cps = cel.checkpoints || [];
    var rumo = rumoGraus(hist[0], atual);
    var opt = { renderer: canvasRenderer, interactive: false };

    // 1) cone de incerteza da trajetória prevista
    if (cps.length) {
      var pts = [{ lat: atual.lat, lon: atual.lon, d: 0 }];
      cps.forEach(function (c) { pts.push({ lat: c.lat, lon: c.lon, d: distKm(atual, c) }); });
      var esq = [], dir = [];
      pts.forEach(function (p) {
        var meia = 4 + 0.3 * p.d;  // km de cada lado, abrindo com a distância
        esq.push(destinoPonto(p.lat, p.lon, rumo - 90, meia));
        dir.push(destinoPonto(p.lat, p.lon, rumo + 90, meia));
      });
      L.polygon(esq.concat(dir.reverse()), Object.assign({ color: COR_CEL, weight: 1, opacity: 0.45, dashArray: "4, 4",
        fillColor: COR_CEL, fillOpacity: 0.13 }, opt)).addTo(celulasLayer);
    }

    // 2) trilha já percorrida: segmentos que ficam mais fortes até a posição atual
    for (var i = 1; i < hist.length; i++) {
      var seg = [[hist[i - 1].lat, hist[i - 1].lon], [hist[i].lat, hist[i].lon]];
      var f = i / (hist.length - 1);
      L.polyline(seg, Object.assign({ color: "#fff", weight: 6.5, opacity: 0.55 * (0.4 + 0.6 * f), lineCap: "round" }, opt)).addTo(celulasLayer);
      L.polyline(seg, Object.assign({ color: COR_CEL, weight: 3.5, opacity: 0.3 + 0.65 * f, lineCap: "round" }, opt)).addTo(celulasLayer);
    }
    hist.slice(0, -1).forEach(function (p, i) {
      L.circleMarker([p.lat, p.lon], Object.assign({ radius: 3.5, color: COR_CEL, weight: 2, fill: true, fillColor: "#fff", fillOpacity: 1,
        opacity: 0.4 + 0.5 * (i / hist.length) }, opt)).addTo(celulasLayer);
    });

    // 3) trajetória prevista (tracejada) com marcas de tempo e seta
    if (cps.length) {
      var linha = [[atual.lat, atual.lon]].concat(cps.map(function (c) { return [c.lat, c.lon]; }));
      L.polyline(linha, Object.assign({ color: "#fff", weight: 6.5, opacity: 0.6, lineCap: "round" }, opt)).addTo(celulasLayer);
      L.polyline(linha, Object.assign({ color: COR_CEL, weight: 3.5, opacity: 0.95, dashArray: "9, 8", lineCap: "round" }, opt)).addTo(celulasLayer);
      cps.forEach(function (c, idx) {
        var m = L.circleMarker([c.lat, c.lon], Object.assign({ radius: 5.5, color: COR_CEL, weight: 2.5, fill: true, fillColor: "#fff", fillOpacity: 1 }, opt));
        m.bindTooltip("+" + c.min + " min", { permanent: true, direction: "right", offset: [8, 0], className: "cel-tip" });
        m.addTo(celulasLayer);
      });
      var fim = cps[cps.length - 1];
      var anterior = cps.length > 1 ? cps[cps.length - 2] : atual;
      var rumoFim = rumoGraus(anterior, fim);
      L.marker([fim.lat, fim.lon], { interactive: false, icon: L.divIcon({
        className: "cel-seta-icon", iconSize: [22, 22], iconAnchor: [11, 11],
        html: '<div class="cel-seta" style="transform:rotate(' + rumoFim.toFixed(0) + 'deg);">▲</div>' }) }).addTo(celulasLayer);
    }

    // 4) posição atual: marcador pulsante + etiqueta com velocidade e rumo
    var atualMarker = L.marker([atual.lat, atual.lon], { icon: L.divIcon({
      className: "cel-pulse-icon", iconSize: [30, 30], iconAnchor: [15, 15], html: '<div class="cel-pulse"><span></span></div>' }) });
    var seta = SETAS_RUMO[cel.rumo_texto] || "";
    atualMarker.bindTooltip("#" + cel.id + " " + seta + " " + Math.round(cel.vel_kmh) + " km/h " + (cel.rumo_texto || ""),
      { permanent: true, direction: "top", offset: [0, -14], className: "cel-tip" });
    atualMarker.addTo(celulasLayer);
  }

  function atualizarLegenda(aneis) {
    var itens = (aneis || []).map(function (a) {
      return '<div style="display:flex; align-items:center; gap:6px; margin-top:2px;">' +
        '<span style="width:12px; height:0; border-top:3px dashed ' + a.cor + '; display:inline-block;"></span>' +
        '<span>' + a.km + ' km</span></div>';
    }).join("");
    var tit = 'font-weight:700; color:#3fc2c2; margin:7px 0 2px;';
    var html = '<div style="font-weight:700; color:#3fc2c2; margin-bottom:2px;">Status da unidade</div>' +
      '<div>🔴 Alto — raio a menos de 30 km</div><div>🟡 Médio — raio a menos de 50 km</div><div>🟢 Sem raios próximos</div>' +
      '<div style="' + tit + '">⚡ Idade do raio</div>' +
      '<div><span style="color:#ef1c1c;">●</span> 0–5 min &nbsp;<span style="color:#f97316;">●</span> 5–10 min</div>' +
      '<div><span style="color:#facc15;">●</span> 10–15 min &nbsp;<span style="color:#22c55e;">●</span> 15–20 min</div>' +
      '<div style="' + tit + '">Deslocamento da célula</div>' +
      '<div><span style="color:#7c3aed; font-weight:900;">━●</span> trilha percorrida</div>' +
      '<div><span style="color:#7c3aed; font-weight:900;">┅▲</span> previsão (+30/60/90 min)</div>' +
      '<div><span style="color:#7c3aed;">◢</span> cone = incerteza</div>';
    if (itens) html += '<div style="' + tit + '">Anéis de distância</div>' + itens;
    html += '<div style="' + tit + '">Divisão de UFs</div><div><span style="display:inline-block; width:14px; border-top:2px solid #1e293b; vertical-align:middle;"></span> limite entre estados</div>';
    document.getElementById("legenda-corpo").innerHTML = html;
  }

  function atualizarStatus(texto) {
    var el = document.getElementById("raios-status-bar");
    // Troca sutil: baixa a opacidade, troca o texto, sobe de novo — sem
    // nenhum "flash" branco/recarregamento, só um fade rápido no textinho.
    el.style.opacity = "0.35";
    setTimeout(function () {
      el.textContent = texto || "";
      el.style.opacity = "1";
    }, 150);
  }

  function aoRenderizar(event) {
    var args = (event.detail && event.detail.args) || {};
    if (!map) iniciarMapa();

    atualizarStatus(args.status_texto);
    redesenharEstacoes(args.estacoes, args.aneis);
    redesenharRaios(args.raios, args.celulas, args.janela_min, args.mostrar_deslocamento);
    atualizarLegenda(args.aneis);

    if (args.som_data_uri && args.som_data_uri !== audioSrcAtual) {
      audio = new Audio(args.som_data_uri);
      audio.preload = "auto";
      audioSrcAtual = args.som_data_uri;
    }

    if (args.tocar_som && args.estacoes_novas && args.estacoes_novas.length) {
      args.estacoes_novas.forEach(function (nome) {
        var marcador = marcadoresPorNome[nome];
        if (marcador && map) map.panTo(marcador.getLatLng());
        abrirPainel(chavePorNome[nome]);
        if (audio) { audio.currentTime = 0; audio.play().catch(function () {}); }
      });
    }

    Streamlit.setFrameHeight(650);
  }

  Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, aoRenderizar);
  Streamlit.setComponentReady();
  Streamlit.setFrameHeight(650);
})();
</script>
</body>
